[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tte_depth"
version = "1.1.0"
authors = [
  { name = "Parker Seegmiller", email = "parker@pkseeg.com" },
]
description = "Statistical depth for transformer-based text embeddings"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
examples = [
    "sentence-transformers>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "sentence-transformers>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/pkseeg/tte_depth"
"Bug Tracker" = "https://github.com/pkseeg/tte_depth/issues"
"Paper" = "https://arxiv.org/abs/2310.15010"

[tool.setuptools.packages.find]
where = ["src"]
